[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chaosrl"
version = "0.1.0"
description = "Autonomous RL-driven Chaos Engineering for Microservice Weakness Discovery"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ChaosRL Research Team" }
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "gymnasium>=0.29.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "tqdm>=4.65.0",
    "pytest>=7.4.0",
    "requests>=2.31.0",
    "networkx>=3.0",
    "stable-baselines3>=2.0.0",
    "sb3-contrib>=2.0.0"
]

[project.scripts]
chaosrl = "chaosrl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "audit: independent research audit tests"
]

